      <p class="muted" style="margin:0;font-size:13px">You have <b class="num">${S.x?.tokens ?? 0}</b> tokens. <button class="link" id="buyTokens">Get more</button></p>
      ${sum ? `
        <p style="margin:0;font-size:16px;font-weight:600">${esc(sum.headline)}</p>
        ${sum.risk ? `<div class="lock" style="background:var(--bad-soft)"><span><b style="color:var(--bad)">Watch out:</b> ${esc(sum.risk)}</span></div>` : ""}
        <div><span class="eyebrow">Do these this month</span><ol>${(sum.actions||[]).map(a => `<li>${esc(a)}</li>`).join("")}</ol></div>
        ${(sum.loved||[]).length || (sum.complaints||[]).length ? `<div class="row" style="align-items:flex-start;gap:18px">
          <div style="flex:1;min-width:200px"><span class="eyebrow" style="color:var(--good)">They love</span><ul style="margin:4px 0 0;padding-left:18px">${(sum.loved||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
          <div style="flex:1;min-width:200px"><span class="eyebrow" style="color:var(--bad)">They complain about</span><ul style="margin:4px 0 0;padding-left:18px">${(sum.complaints||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        </div>` : ""}
        ${sum.playbook ? `<div><span class="eyebrow">${esc(sum.playbook.title)}</span><p class="muted" style="margin:4px 0;font-size:14px">${esc(sum.playbook.intro||"")}</p>${(sum.playbook.items||[]).map(i => `<div class="result"><div><b>${esc(i.name)}</b><div class="muted" style="font-size:13px">${esc(i.why)}</div></div>${i.price_idea?`<span class="tag">${esc(i.price_idea)}</span>`:""}</div>`).join("")}<p class="muted" style="margin:6px 0 0;font-size:12px">Benita's suggestions to try. You know your customers and costs best.</p></div>` : ""}
        ${sum.reply_tip ? `<p class="muted" style="margin:0;font-size:14px"><b>Reply tip:</b> ${esc(sum.reply_tip)}</p>` : ""}
        <p class="muted" style="margin:0;font-size:12px">Based on ${esc(sum.based_on || ai.review_count + " reviews")} · ${ago(ai.created_at)}</p>`
      : `<p class="muted" style="margin:0;font-size:14px">Benita reads your reviews in English, Shona or Ndebele, looks at what people search for near you, and tells you what to fix first. ${/food|dining|restaurant|cafe/i.test(d.business.category||"") ? "She'll also propose a menu, and say why." : "She'll also propose offers to try, and say why."} Your first report is on us.</p>`}
    </section>

    <section class="panel"><div class="spread"><h2>Themes in your reviews</h2><span class="eyebrow">free, updates live</span></div>
      <div style="margin-top:8px">${auto.themes.map(t => { const tot = t.praise + t.complaints; return `<div class="theme"><b>${esc(t.label)}</b><span class="num muted" style="font-size:13px">${t.praise} 👍 · ${t.complaints} 👎</span><div class="split"><span class="p" style="width:${t.praise/tot*100}%"></span><span class="n" style="width:${t.complaints/tot*100}%"></span></div>${t.complaints>t.praise?`<p>${esc(t.fix)}</p>`:""}</div>`; }).join("") || '<p class="muted">Not enough review text yet to spot themes.</p>'}</div>
    </section>`;
  S.draftAsk = "";
  const thread = v.querySelector("#askThread"); thread.scrollTop = thread.scrollHeight;
  const ask = async q => { if (q.trim().length < 2) return toast("Type your question first."); if ((S.x?.tokens ?? 0) < 1){ S.tab = "plan"; render(); return toast("You're out of tokens."); } const go = v.querySelector("#askGo"); go.disabled = true; go.textContent = "…"; thread.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(q)}</div><div class="msg" id="askWait">Benita is thinking…</div>`); thread.scrollTop = thread.scrollHeight; try { const r = await S.api.benita(S.bizId, "ask", null, q); await refresh(); toast(r.tokens + " tokens left"); } catch(x){ toast(x.message); go.disabled = false; go.textContent = "Ask"; v.querySelector("#askWait")?.remove(); } };
  v.querySelector("#askGo").onclick = () => ask(v.querySelector("#askBox").value);
  v.querySelectorAll("[data-q]").forEach(c => c.onclick = () => ask(c.dataset.q));
  v.querySelector("#autoBtn").onclick = async () => { try { await S.api.setAuto(S.bizId, !on); toast(on ? "Auto-reply is off" : "Auto-reply is on"); await refresh(); } catch(x){ toast(x.message); } };
  v.querySelector("#marketBtn").onclick = async e => { if ((S.x?.tokens ?? 0) < 3){ S.tab = "plan"; render(); return toast("You need 3 tokens."); } e.target.disabled = true; e.target.textContent = "Checking…"; try { const r = await S.api.benita(S.bizId, "market"); v.querySelector("#marketOut").textContent = r.answer; v.querySelector("#marketOut").classList.remove("muted"); S.x.tokens = r.tokens; e.target.textContent = "Check again · 3 tokens"; } catch(x){ toast(x.message); e.target.textContent = "Check · 3 tokens"; } e.target.disabled = false; };
  $("#buyTokens").onclick = () => { S.tab = "plan"; render(); };
  $("#aiBtn").onclick = async e => {
    if ((S.x?.tokens ?? 0) < 10){ S.tab = "plan"; render(); return toast("You need 10 tokens for a report."); }
    e.target.disabled = true; e.target.textContent = "Benita is reading…";
    try { const r = await S.api.benita(S.bizId, "report"); toast("Your report is ready"); if (S.mode === "demo") S.x.tokens = r.tokens; await refresh(); } catch(x){ toast(x.message); e.target.disabled = false; e.target.textContent = "Try again"; }
  };
}

/* ---------- MORE ---------- */
function viewMore(v){
  const admin = S.list?.is_admin;
  v.innerHTML = `<section class="panel"><div>
    ${[["page","Page details","Phone, hours, address and description"],["plan","Tokens & payments",`You have ${S.x?.tokens ?? 0} tokens`],["claim","Claim another business","Add a branch or a second business"]].map(([k,t,p]) => `<div class="todo"><span class="dot ${k==="admin"?"seal":""}"></span><div><b>${t}</b><p>${p}</p></div><button class="btn ghost sm" data-go="${k}">Open</button></div>`).join("")}
  </div></section>
  <section class="panel stack"><span class="eyebrow">The Digital Package</span><h2>${S.x?.boughtWebsite || S.x?.hasWebsite ? "Your website" : `A fresh website, from $${esc(S.x?.websiteFrom || "30")}`}</h2><p class="muted" style="margin:0;font-size:14px">Your own domain, one tap to WhatsApp, and your reviews on show.</p><div><button class="btn sm seal" id="pkg">See what's included</button></div></section>
  ${admin ? `<section class="panel spread"><span>CEO desk</span><a class="btn ghost sm" href="/admin" style="text-decoration:none">Open</a></section>` : ""}
  <section class="panel spread"><span class="muted" style="font-size:14px">${S.mode==="demo" ? "Preview mode" : "Signed in as " + esc(S.me?.email || "")}</span>${S.mode==="live"?'<button class="btn ghost sm" id="out">Sign out</button>':""}</section>`;
  v.querySelectorAll("[data-go]").forEach(x => x.onclick = () => { S.tab = x.dataset.go; render(); window.scrollTo(0,0); });
  $("#pkg").onclick = () => packageSheet("more");
  $("#out")?.addEventListener("click", async () => { await S.api.signOut(); S.me = null; renderAuth(); });
}

function viewPage(v){
  const b = S.d.business;
  v.innerHTML = `<form class="panel stack" id="pageForm"><div class="spread"><h2>Page details</h2><button type="button" class="btn ghost sm" id="back">Back</button></div>
    <p class="muted" style="margin:0;font-size:14px">This is what customers see on Trusthub and Trusthub Connect.</p>
    <label>Phone / WhatsApp<input id="fPhone" value="${esc(b.phone||"")}" inputmode="tel"></label>
    <label>Opening hours<input id="fHours" value="${esc(b.opening_hours||"")}" placeholder="Mon–Fri 8am–5pm, Sat 8am–1pm"></label>
    <label>Address<input id="fAddr" value="${esc(b.address||"")}"></label>
    <label>Website or social page<input id="fWeb" value="${esc(b.website||"")}"></label>
    <label>About your business<textarea id="fDesc" maxlength="1500">${esc(b.description||"")}</textarea></label>
    <button class="btn">Save changes</button></form>`;
  $("#back").onclick = () => { S.tab = "more"; render(); };
  $("#pageForm").onsubmit = async e => { e.preventDefault(); try { await S.api.updateProfile(S.bizId, { phone: $("#fPhone").value, opening_hours: $("#fHours").value, address: $("#fAddr").value, website: $("#fWeb").value, description: $("#fDesc").value }); toast("Saved"); await refresh(); } catch(x){ toast(x.message); } };
}

/* ---------- PLANS ---------- */
const PACKS = [ { k:"tokens_small", name:"50 tokens", price:5, note:"For example: 20 review replies, 20 questions and a report" }, { k:"tokens_large", name:"200 tokens", price:15, note:"Best value, for busy businesses" } ];
const STATUS = { pending:"Being checked", confirmed:"Confirmed", rejected:"Not received" };
const PRODUCT = { website:"Website", tokens_small:"50 tokens", tokens_large:"200 tokens", growth:"Growth", pro:"Pro", other:"Other" };
const PLANS = [];
function viewPlan(v){
  v.innerHTML = `
    <section class="panel stack"><span class="eyebrow">How TrustHub works</span><h2>Free to use. Tokens when Benita does the work.</h2><p class="muted" style="margin:0;font-size:14px">Reviews, replies, customer chats, posts and your daily feed are always free when you do them yourself.</p></section>
    <section class="panel stack"><div class="spread"><div><span class="eyebrow">Benita tokens</span><h2 style="margin-top:4px">You have <span class="num">${S.x?.tokens ?? 0}</span> tokens</h2></div></div>
      <div>${[["Ask Benita a question","1"],["Reply to a review","1"],["Write a post","1"],["Market check","3"],["Full report with a proposed menu or offers","10"]].map(([a,b]) => `<div class="result"><span>${a}</span><b class="num">${b}</b></div>`).join("")}</div><p class="muted" style="margin:0;font-size:14px">Tokens never expire.</p>
      ${PACKS.map(p => `<div class="result"><div><b>${p.name} · $${p.price}</b><div class="muted" style="font-size:13px">${p.note}</div></div><button class="btn sm" data-buy="${p.k}">Buy</button></div>`).join("")}</section>
    ${(S.x?.payments||[]).length ? `<section class="panel"><h2>Your payments</h2>${S.x.payments.map(p => `<div class="result"><div><b>${esc(PRODUCT[p.product]||p.product)}</b><div class="muted" style="font-size:13px">${ago(p.created_at)}</div></div><span>${p.amount ? "$"+esc(p.amount) : ""} · ${esc(STATUS[p.status]||p.status)}</span></div>`).join("")}</section>` : ""}
    <section class="panel"><h2>How paying works</h2><p class="muted" style="margin:6px 0 0;font-size:14px">Pay with EcoCash, InnBucks, OneMoney, bank transfer or cash at a Trusthub agent. Enter your payment reference here and we add your tokens, usually the same day.</p></section>`;
  v.querySelectorAll("[data-buy]").forEach(x => x.onclick = () => {
    const p = PLANS.find(z => z.k === x.dataset.buy) || PACKS.find(z => z.k === x.dataset.buy), monthly = !!PLANS.find(z => z.k === x.dataset.buy);
    const site = !S.x?.hasWebsite && !S.x?.boughtWebsite;
    sheet(`<h2>${p.name} · $${p.price}${monthly ? " a month" : ""}</h2>
      <label>How did you pay?<select id="payM"><option>EcoCash</option><option>InnBucks</option><option>OneMoney</option><option>Bank transfer</option><option>Cash to agent</option></select></label>
      <label>Payment reference<input id="payR" placeholder="e.g. the EcoCash confirmation code"></label>
      <p class="muted" style="margin:0;font-size:13px">Ask your Trusthub agent for the payment number if you don't have it.</p>
      ${site ? `<div class="lock"><span><b>Need a website too?</b> A fresh site with a strong domain, from $${esc(S.x?.websiteFrom || "30")}.</span><button class="btn seal sm" data-site>Ask an agent</button></div>` : ""}
      <div class="row"><button class="btn" data-req>Send for approval</button><button class="btn ghost" data-close>Cancel</button></div>`, s => {
        s.querySelector("[data-site]")?.addEventListener("click", () => openChat("payment"));
        s.querySelector("[data-close]").onclick = () => s.remove();
        s.querySelector("[data-req]").onclick = async () => { const ref = s.querySelector("#payR").value.trim(); if (!ref) return toast("Add the payment reference."); try { await S.api.pay(S.bizId, p.k, s.querySelector("#payM").value, ref); s.remove(); toast("Sent. We'll confirm shortly."); await refresh(); } catch(e){ toast(e.message); } };
    });
  });
}

/* ---------- CLAIM ---------- */
function viewClaim(v){
  const has = S.list?.businesses?.length;
  v.innerHTML = `
    ${has ? `<button class="btn ghost sm" id="back" style="align-self:flex-start">← Back</button>` : `<section class="panel stack"><h1 style="font-size:28px">Find your business</h1><p class="muted" style="margin:0">Trusthub already lists ${S.mode==="demo"?"thousands of":"almost 15,000"} businesses across Zimbabwe. Find yours and claim it. It's free.</p></section>`}
    ${(S.list?.claims||[]).map(c => `<div class="lock"><span><b>${esc(c.business_name)}</b>: your claim is ${esc(c.status.replace("_"," "))}. We'll call you to confirm.</span></div>`).join("")}
    <section class="panel stack"><form class="row" id="findForm" style="flex-wrap:nowrap"><input id="q" placeholder="Business name" autocomplete="off"><input id="city" placeholder="City" style="max-width:120px"><button class="btn">Search</button></form>
      <div id="results"><p class="muted" style="font-size:14px;margin:0">Type at least two letters of your business name.</p></div></section>`;
  $("#back")?.addEventListener("click", () => { S.tab = "more"; render(); });
  $("#findForm").onsubmit = async e => {
    e.preventDefault(); const q = $("#q").value.trim(); if (q.length < 2) return;
    $("#results").innerHTML = '<p class="muted">Searching…</p>';
    const res = await S.api.find(q, $("#city").value.trim());
    $("#results").innerHTML = res.map(b => `<div class="result"><div><b>${esc(b.name)}</b><div class="muted" style="font-size:13px">${esc([b.category,b.area,b.city].filter(Boolean).join(" · "))} · ${b.reviews_count} reviews</div></div>${b.claimed ? '<span class="tag">Claimed</span>' : `<button class="btn sm" data-claim="${b.id}" data-name="${esc(b.name)}">Claim</button>`}</div>`).join("") || '<p class="muted">No match. Check the spelling, or ask a Trusthub agent to add your business.</p>';
    $("#results").querySelectorAll("[data-claim]").forEach(x => x.onclick = () => claimForm(x.dataset.claim, x.dataset.name));
  };
}
function claimForm(id, name){
  sheet(`<h2>Claim ${esc(name)}</h2><p class="muted" style="margin:0;font-size:14px">The TrustHub team will confirm you run this business. This protects you from people pretending to be you.</p>
    <label>Your name<input id="cName"></label>
    <label>Your role<select id="cRole"><option>Owner</option><option>Manager</option><option>Staff</option></select></label>
    <label>Phone<input id="cPhone" inputmode="tel"></label>
    <label>WhatsApp<input id="cWa" inputmode="tel"></label>
    <label>Email (optional)<input id="cEmail" type="email"></label>
    <label>How can we confirm it's you?<textarea id="cNotes" placeholder="e.g. I can send a photo of the shop licence or a utility bill"></textarea></label>
    <div class="row"><button class="btn" data-send>Send claim</button><button class="btn ghost" data-close>Cancel</button></div>`, s => {
      s.querySelector("[data-close]").onclick = () => s.remove();
      s.querySelector("[data-send]").onclick = async () => {
        const f = { name: s.querySelector("#cName").value, role: s.querySelector("#cRole").value, phone: s.querySelector("#cPhone").value, whatsapp: s.querySelector("#cWa").value, email: s.querySelector("#cEmail").value, notes: s.querySelector("#cNotes").value };
        if (!f.name.trim() || !f.phone.trim()) return toast("Add your name and phone number.");
        try { const r = await S.api.submitClaim(id, f); s.remove(); const code = store.get("agent"); if (code && r.claim_id) await S.api.referral(r.claim_id, code).catch(() => null); toast(r.status === "already_pending" ? "You already have a claim waiting for this business." : r.status === "already_owner" ? "You already manage this business." : "Claim sent. We'll confirm it soon."); S.list = await S.api.myBusinesses(); render();
          if (r.status === "submitted") sheet(`<span class="eyebrow">Claim sent</span><h2>While we confirm ${esc(name)}</h2><p class="muted" style="margin:0;font-size:14px">Once you're verified you can reply to reviews for free, and Benita gives you a free report with tips for your business.</p>
            <div class="lock"><span><b>Does your business have a website?</b> We can build you a fresh one with a strong domain, from $30.</span><a class="btn seal sm" href="/digital${code ? "?a=" + encodeURIComponent(code) : ""}" style="text-decoration:none">See how</a></div>
            <div class="row"><button class="btn ghost" data-close>Close</button></div>`, q => { q.querySelector("[data-close]").onclick = () => q.remove(); }); } catch(e){ toast(e.message); }
      };
  });
}

boot().catch(e => { $("#app").innerHTML = `<div class="wrap auth"><div class="card panel"><h2>Something went wrong</h2><p class="muted">${esc(e.message)}</p></div></div>`; });
</script>

</body></html>
